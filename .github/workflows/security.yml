name: Security Scan

on:
  push:
    branches: [main, develop]
  schedule:
    # Weekly security scan on Monday at 6:07 AM UTC
    - cron: "7 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ─── Secret Detection ────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ─── Backend SAST ────────────────────────────────────────────────────
  backend-sast:
    name: Backend SAST (Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Bandit security analysis
        run: |
          bandit -r app/ \
            -c pyproject.toml \
            -f json \
            -o bandit-results.json \
            --severity-level medium || true

      - name: Display results
        if: always()
        run: bandit -r app/ -c pyproject.toml -ll --severity-level medium
        continue-on-error: true

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: backend/bandit-results.json
          retention-days: 30

  # ─── Dependency Audit ────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit --strict --desc on -r backend/requirements.txt
        continue-on-error: true

      - name: Node dependency audit
        run: |
          cd frontend
          npm ci
          npm audit --omit=dev
        continue-on-error: true

  # ─── CodeQL Analysis ─────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
